<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Study | Suraj Divekar</title><style>:root{--bg:#03070b;--panel:#08151d;--line:#174457;--cyan:#20e6ff;--yellow:#ffe33d;--muted:#9fb3bd;--white:#f4f8fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#123544 0,#03070b 42%),#03070b;color:var(--white);font:15px/1.65 Inter,system-ui,sans-serif}.wrap{width:min(1050px,92%);margin:auto}a{color:inherit;text-decoration:none}.nav{border-bottom:1px solid var(--line);padding:18px 0;background:#03070be8}.brand{font-weight:950;letter-spacing:.06em}.brand small{display:block;color:var(--yellow);font-size:9px;letter-spacing:.15em}.hero{padding:85px 0 55px;border-bottom:1px solid #12303d}.label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.9;text-transform:uppercase;margin:12px 0}.hero p{max-width:780px;color:#c7d6dc}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid #376579;border-radius:20px;padding:3px 9px;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:45px 0 75px}.card{background:linear-gradient(145deg,#0a1c26,#040b10);border:1px solid var(--line);border-radius:13px;padding:24px}.card h2{font-size:13px;color:var(--yellow);text-transform:uppercase;margin:0 0 9px}.card p{color:#c8d7dd;font-size:13px;margin:0}.back{display:inline-block;margin-top:30px;border:1px solid var(--yellow);padding:10px 15px;border-radius:7px;font-size:10px;font-weight:900;text-transform:uppercase}.note{grid-column:1/-1;color:#728c97;font-size:10px;border-left:2px solid var(--cyan);padding-left:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><div class="wrap"><a class="brand" href="index.html">SURAJ DIVEKAR<small>GAME QA MISSION CONTROL</small></a></div></nav><header class="hero"><div class="wrap"><div id="role" class="label"></div><h1 id="title"></h1><p id="intro"></p><div id="tags" class="tags"></div><a class="back" href="index.html#portfolio">← Back to Missions</a></div></header><main class="wrap"><div id="grid" class="grid"></div></main><script>
const data={
battlefield:{title:"Battlefield 6",role:"QA Engineer · Risk & Release",platforms:"PlayStation · Xbox · PC",scope:"Risk-based test planning, stability, regression, performance validation and release readiness.",strategy:"Prioritize critical paths and edge cases; execute targeted coverage around high-impact build risks; document evidence for triage and release discussions.",challenge:"Live-service build changes can introduce regressions across connected systems and platforms. The portfolio scope emphasizes controlled risk coverage rather than exhaustive testing.",bug:"Example portfolio scenario: a high-impact state transition fails after a multiplayer interaction. Investigation would capture exact reproduction, logs, platform/build context and frequency.",rca:"Reproduce consistently → isolate the triggering state → compare logs/evidence → identify likely change area → verify the fix → run adjacent regression.",regression:"Start with the affected feature and dependencies, then expand to nearby gameplay, multiplayer, platform and stability scenarios.",result:"Resume-supported impact includes improved build stability by 4–6% and stronger risk-based regression planning.",evidence:"Evidence is intentionally described rather than reproduced. Add only non-confidential screenshots/video you are permitted to publish."},
farcry:{title:"Far Cry 6",role:"Game Tester · Compliance & QA Metrics",platforms:"Console · PC",scope:"Compliance/certification validation, defect triage, milestone validation and QA reporting.",strategy:"Map test coverage to platform requirements, document deviations precisely, verify fixes and communicate milestone quality signals.",challenge:"Certification requires precise reproduction and evidence against platform expectations while game changes continue through milestones.",bug:"Example portfolio scenario: a platform-compliance requirement is violated under a specific menu or save-state condition. The ticket would identify requirement reference, steps, expected/actual behavior and evidence.",rca:"Confirm requirement → reproduce on target platform → isolate preconditions → capture evidence → verify fix against the same requirement → regression nearby flows.",regression:"Re-run the failed compliance path, then cover related platform interactions and impacted milestone functionality.",result:"Resume-supported contribution includes presenting QA metrics, defect trends and release-readiness reporting.",evidence:"Use only screenshots or footage you are permitted to publish."},
skull:{title:"Skull & Bones",role:"Game Tester · Live-Service QA",platforms:"PlayStation · Xbox · PC",scope:"Gameplay and stability validation, multiplayer systems, performance checks and patch verification.",strategy:"Use smoke gates for build health, focused functional/regression coverage for changed areas, and evidence-based triage for high-impact defects.",challenge:"Live-service patches require confidence that fixes do not destabilize adjacent systems or previously working player flows.",bug:"Example portfolio scenario: a patch changes a multiplayer state and causes a player-facing failure after a reconnect or transition.",rca:"Compare pre/post-patch behavior → reproduce under controlled network/state conditions → collect logs → narrow the affected transition → validate fix.",regression:"Patch-specific checks first, then impacted multiplayer, progression, stability and cross-platform scenarios.",result:"Resume-supported work includes patch validation, milestone delivery and QA status communication.",evidence:"No confidential project media is embedded."},
riders:{title:"Riders Republic",role:"Game Tester · Cross-Platform QA",platforms:"Console · PC",scope:"Cross-platform testing, UI/UX validation, regression and live-service support.",strategy:"Validate player-facing flows across supported platforms, prioritize changed functionality, and track regressions with clear reproduction data.",challenge:"Cross-platform behavior can diverge in input, UI, performance or platform-specific flows, making consistent reproduction important.",bug:"Example portfolio scenario: a UI interaction behaves differently after a live-service update on one platform.",rca:"Reproduce by platform → compare expected behavior and controls → capture platform/build evidence → isolate platform-specific condition → verify fix.",regression:"Retest the exact platform path and then run the shared UI/gameplay flow on other supported platforms.",result:"Resume-supported project contribution includes cross-studio QA collaboration across PlayStation, Xbox, PC and Steam Deck.",evidence:"Add publishable gameplay clips here when available."},
monopoly:{title:"MONOPOLY",role:"Game Tester · Certification",platforms:"PlayStation · Xbox · PC",scope:"Sony TRC and Microsoft VRC compliance testing, cross-platform validation, defect triage and patch verification.",strategy:"Treat certification requirements as testable acceptance criteria, maintain precise evidence, verify fixes and protect milestone readiness.",challenge:"Platform certification demands exact compliance behavior while maintaining coverage across multiple target platforms.",bug:"Example portfolio scenario: a platform requirement fails only after a specific player flow. The report would link the observed behavior to the requirement and capture reproducible evidence.",rca:"Identify requirement → reproduce on target platform → document exact deviation → provide evidence → verify fix → rerun related compliance coverage.",regression:"Certification path first, then neighboring platform flows and shared gameplay behavior affected by the fix.",result:"Resume-supported contribution includes certification/launch readiness for AAA cross-platform releases.",evidence:"Publish only non-confidential material or self-created diagrams."},
wildcore:{title:"Wild Core Arena",role:"Game Tester · Mobile Live Service",platforms:"Android · iOS",scope:"Functional and performance testing, crash/compatibility coverage, UI/UX validation and live-service support.",strategy:"Combine device/platform coverage with targeted regression, crash reproduction, performance observation and structured defect reporting.",challenge:"Mobile QA requires attention to device compatibility, performance, UI behavior and live-service changes without losing core gameplay coverage.",bug:"Example portfolio scenario: a live-service update causes a UI or stability issue on a subset of mobile conditions.",rca:"Capture device/OS/build → reproduce → collect logs and performance context → narrow trigger → verify fix on affected and representative devices.",regression:"Changed feature → adjacent UI/gameplay → crash/stability → representative device/OS combinations.",result:"Resume-supported recognition includes improved defect-triage efficiency through structured bug reporting and RCA practices.",evidence:"Do not publish internal builds, logs or unreleased assets."},
prince:{title:"Prince of Persia: The Lost Crown",role:"QA · Mobile",platforms:"iOS · Android",scope:"Mobile QA, gameplay regression and iOS/Android validation.",strategy:"Focus regression around changed gameplay and player-facing flows while checking stability and platform-specific behavior across iOS and Android.",challenge:"Mobile releases require repeatable gameplay coverage while accounting for platform differences and device conditions.",bug:"Example portfolio scenario: a gameplay flow regresses after a mobile update on one platform/device condition.",rca:"Record device/OS/build → reproduce → compare platform behavior → isolate trigger → verify fix → repeat targeted regression.",regression:"Changed gameplay flow first, then adjacent progression, UI and stability scenarios.",result:"This portfolio entry is intentionally limited to iOS and Android, matching the project scope provided for the portfolio.",evidence:"Use only self-captured or authorized media."}};
const key=new URLSearchParams(location.search).get("game")||"battlefield",g=data[key]||data.battlefield;
document.getElementById("role").textContent=g.role;document.getElementById("title").textContent=g.title;document.getElementById("intro").textContent=g.scope;document.getElementById("tags").innerHTML=g.platforms.split(" · ").map(x=>'<span class="tag">'+x+'</span>').join("");
const fields=[["Role",g.role],["Platforms",g.platforms],["Testing Scope",g.scope],["Test Strategy",g.strategy],["Major Challenges",g.challenge],["Example Bug",g.bug],["RCA Approach",g.rca],["Regression Strategy",g.regression],["Result / Impact",g.result],["Screenshots / Video Evidence",g.evidence]];
document.getElementById("grid").innerHTML=fields.map(x=>'<article class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join("")+'<div class="note">Portfolio case study: content is limited to information supported by the supplied resume. Synthetic examples are explicitly labelled and no confidential project data is presented.</div>';
</script></body></html>
